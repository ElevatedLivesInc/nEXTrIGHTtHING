<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Intake Queue — Staff Only</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=Raleway:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  :root{--navy:#1a2744;--navy-deep:#121c33;--sand:#c9a96e;--sand-light:#e8d5b0;--lav:#c9b6f0;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--navy-deep);color:#fff;font-family:'Raleway',sans-serif;min-height:100vh;}
  .top{background:var(--navy);border-bottom:2px solid rgba(201,169,110,.5);padding:1.4rem 1.5rem;}
  .top-inner{max-width:1080px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;}
  h1{font-family:'Cormorant Garamond',serif;font-weight:400;font-size:1.7rem;}
  h1 em{color:var(--sand-light);font-style:italic;}
  .viewer{font-size:.72rem;color:rgba(255,255,255,.5);}
  .wrap{max-width:1080px;margin:0 auto;padding:1.5rem;}
  .bar{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1.4rem;align-items:center;}
  .fbtn{padding:.45rem 1.1rem;border-radius:50px;border:1px solid rgba(201,169,110,.35);background:transparent;color:rgba(255,255,255,.7);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;font-family:'Raleway',sans-serif;}
  .fbtn.active{background:rgba(201,169,110,.2);color:var(--sand-light);border-color:rgba(201,169,110,.6);}
  .count{margin-left:auto;font-size:.72rem;color:rgba(255,255,255,.45);}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:1rem;}
  .card{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:1.2rem 1.3rem;display:flex;flex-direction:column;gap:.7rem;}
  .card.priority{border-color:rgba(224,120,120,.55);box-shadow:0 0 22px rgba(224,120,120,.1);}
  .chead{display:flex;justify-content:space-between;gap:.75rem;align-items:baseline;}
  .cname{font-family:'Cormorant Garamond',serif;font-size:1.25rem;color:var(--sand-light);}
  .cwhen{font-size:.66rem;color:rgba(255,255,255,.4);white-space:nowrap;}
  .flags{display:flex;flex-wrap:wrap;gap:.4rem;}
  .flag{font-size:.6rem;letter-spacing:.08em;text-transform:uppercase;padding:.22rem .6rem;border-radius:4px;font-weight:600;}
  .flag.hot{background:rgba(224,120,120,.18);color:#f0b6b6;border:1px solid rgba(224,120,120,.4);}
  .flag.warm{background:rgba(201,169,110,.15);color:var(--sand-light);border:1px solid rgba(201,169,110,.4);}
  .flag.info{background:rgba(124,92,191,.18);color:var(--lav);border:1px solid rgba(124,92,191,.4);}
  .rows{font-size:.8rem;color:rgba(255,255,255,.78);line-height:1.55;font-weight:300;}
  .rows b{color:#fff;font-weight:600;}
  .rows a{color:var(--sand-light);text-decoration:none;}
  .msg{font-size:.78rem;color:rgba(255,255,255,.6);font-style:italic;border-left:2px solid rgba(201,169,110,.35);padding-left:.7rem;}
  .status-row{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:auto;padding-top:.5rem;}
  .sbtn{flex:1;min-width:70px;padding:.4rem .3rem;font-size:.62rem;letter-spacing:.06em;text-transform:uppercase;border-radius:5px;border:1px solid rgba(255,255,255,.15);background:transparent;color:rgba(255,255,255,.55);cursor:pointer;font-family:'Raleway',sans-serif;}
  .sbtn.on{background:rgba(201,169,110,.25);color:var(--sand-light);border-color:rgba(201,169,110,.6);font-weight:700;}
  .note{max-width:640px;margin:3rem auto;text-align:center;color:rgba(255,255,255,.6);font-size:.9rem;line-height:1.8;}
  .note code{background:rgba(255,255,255,.08);padding:.1rem .4rem;border-radius:4px;font-size:.8rem;}
  .cklist{display:flex;flex-wrap:wrap;gap:.35rem .9rem;padding:.5rem .7rem;background:rgba(201,169,110,.06);border:1px solid rgba(201,169,110,.2);border-radius:6px;}
  .cklist label{display:flex;align-items:center;gap:.35rem;font-size:.72rem;color:rgba(255,255,255,.75);cursor:pointer;}
  .cklist input{accent-color:#c9a96e;}
  .notesbox{width:100%;min-height:52px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);border-radius:6px;color:#fff;font-family:'Raleway',sans-serif;font-size:.76rem;padding:.5rem .7rem;resize:vertical;}
  .notesave{font-size:.6rem;letter-spacing:.06em;text-transform:uppercase;padding:.35rem .8rem;border-radius:5px;border:1px solid rgba(201,169,110,.4);background:transparent;color:var(--sand-light);cursor:pointer;font-family:'Raleway',sans-serif;}
  .pbar{height:6px;background:rgba(255,255,255,.08);border-radius:4px;overflow:hidden;}
  .pbar i{display:block;height:100%;background:linear-gradient(90deg,#c9a96e,#e8d5b0);border-radius:4px;transition:width .3s;}
  .ready{background:rgba(120,200,150,.18)!important;color:#a9e5c3!important;border:1px solid rgba(120,200,150,.5)!important;}
  .qstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:.8rem;margin-bottom:1.3rem;}
  .qstat{background:rgba(255,255,255,.04);border:1px solid rgba(201,169,110,.25);border-radius:10px;padding:.8rem 1rem;text-align:center;}
  .qstat .n{font-family:'Cormorant Garamond',serif;font-size:1.7rem;color:var(--sand-light);}
  .qstat .l{font-size:.58rem;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.5);margin-top:.2rem;}
  .nf{margin-bottom:.65rem;}
  .nf label{display:block;font-size:.55rem;letter-spacing:.09em;text-transform:uppercase;color:rgba(255,255,255,.5);margin-bottom:.22rem;}
  .nf input,.nf select,.nf textarea{width:100%;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.15);border-radius:6px;color:#fff;font-family:'Raleway',sans-serif;font-size:.8rem;padding:.48rem .65rem;}
  .nf2{display:grid;grid-template-columns:1fr 1fr;gap:.7rem;}
  @media(max-width:600px){.nf2{grid-template-columns:1fr;}}
  .delbtn{margin-left:auto;font-size:.6rem;letter-spacing:.06em;text-transform:uppercase;padding:.35rem .8rem;border-radius:5px;border:1px solid rgba(224,120,120,.35);background:transparent;color:#f0b6b6;cursor:pointer;font-family:'Raleway',sans-serif;}
</style>
</head>
<body>
<div class="top"><div class="top-inner">
  <h1>Pre-Intake <em>Queue</em></h1>
  <div style="display:flex;align-items:center;gap:.2rem;flex-wrap:wrap"><span class="viewer" id="viewer"></span><a href="/mission-control" class="mcback" style="display:inline-block;font-size:.72rem;letter-spacing:.04em;color:#e8d5b0;text-decoration:none;border:1px solid rgba(201,169,110,.45);border-radius:50px;padding:.3rem .85rem;white-space:nowrap;margin-left:1rem">&larr; Mission Control</a></div>
</div></div>

<div class="wrap">
  <div class="qstats" id="qstats" style="display:none">
    <div class="qstat"><div class="n" id="qNew">0</div><div class="l">New</div></div>
    <div class="qstat"><div class="n" id="qHot">0</div><div class="l">Reach Out 24h</div></div>
    <div class="qstat"><div class="n" id="qReady">0</div><div class="l">Ready For Intake</div></div>
    <div class="qstat"><div class="n" id="qIntaked">0</div><div class="l">Intaked</div></div>
  </div>
  <div class="bar" id="filters" style="display:none">
    <button class="fbtn active" data-f="open">Open</button>
    <button class="fbtn" data-f="new">New</button>
    <button class="fbtn" data-f="contacted">Contacted</button>
    <button class="fbtn" data-f="scheduled">Scheduled</button>
    <button class="fbtn" data-f="intaked">Intaked</button>
    <button class="fbtn" data-f="closed">Closed</button>
    <button class="fbtn" data-f="all">All</button>
    <button class="fbtn" style="background:rgba(201,169,110,.28);color:var(--sand-light);font-weight:700" onclick="openNew()">+ Add Request</button>
    <span class="count" id="count"></span>
  </div>
  <div class="grid" id="grid"></div>
  <div class="note" id="note">Loading…</div>
</div>

<div id="newModal" style="display:none;position:fixed;inset:0;background:rgba(2,4,12,.93);z-index:100;overflow-y:auto;padding:2rem 1rem">
  <div style="max-width:620px;margin:0 auto;background:#1a2744;border:1px solid rgba(201,169,110,.4);border-radius:12px;padding:1.6rem">
    <h2 style="font-family:'Cormorant Garamond',serif;font-weight:400;font-size:1.5rem;color:var(--sand-light);margin-bottom:.2rem">Add a Request</h2>
    <div style="font-size:.75rem;color:rgba(255,255,255,.5);margin-bottom:1.1rem">Someone who called, walked in, or was referred &mdash; not from the website.</div>
    <div class="nf2">
      <div class="nf"><label>First name</label><input id="n_first"></div>
      <div class="nf"><label>Last name</label><input id="n_last"></div>
    </div>
    <div class="nf2">
      <div class="nf"><label>Phone</label><input id="n_phone"></div>
      <div class="nf"><label>Email</label><input id="n_email"></div>
    </div>
    <div class="nf2">
      <div class="nf"><label>How did they reach us?</label><select id="n_source">
        <option value="phone">Phone call</option><option value="walk-in">Walk-in</option>
        <option value="professional">Professional referral</option><option value="court">Court / probation</option>
        <option value="hospital">Hospital / detox discharge</option><option value="alumni">Alumni / word of mouth</option>
        <option value="other">Other</option></select></div>
      <div class="nf"><label>Referred by (name / agency)</label><input id="n_ref" placeholder="e.g. PO Sanchez, Utah Case Mgmt"></div>
    </div>
    <div class="nf2">
      <div class="nf"><label>Reaching out as</label><select id="n_as"><option value="self">Themselves</option><option value="family">Family member</option></select></div>
      <div class="nf"><label>Insurance</label><select id="n_ins"><option value="">&mdash;</option><option>Medicaid</option><option>Medicare</option><option>Private insurance</option><option>No insurance</option><option>Not sure</option></select></div>
    </div>
    <div class="nf2">
      <div class="nf"><label>Housing needed?</label><select id="n_house"><option value="">&mdash;</option><option>Yes</option><option>No</option><option>Not sure</option></select></div>
      <div class="nf"><label>Probation / parole?</label><select id="n_prob"><option value="">&mdash;</option><option>Yes</option><option>No</option><option>Prefer not to say</option></select></div>
    </div>
    <div class="nf2">
      <div class="nf"><label>Primary substance</label><input id="n_sub"></div>
      <div class="nf"><label>Last use</label><select id="n_use"><option value="">&mdash;</option><option>Today</option><option>This week</option><option>This month</option><option>Over a month ago</option><option>Prefer not to say</option></select></div>
    </div>
    <div class="nf"><label>Best time to reach them</label><select id="n_time"><option value="">Any time</option><option>Morning</option><option>Afternoon</option><option>Evening</option></select></div>
    <div class="nf"><label>Notes from the call</label><textarea id="n_msg" class="notesbox"></textarea></div>
    <div style="display:flex;gap:.5rem;margin-top:.8rem">
      <button class="notesave" style="background:rgba(201,169,110,.25);font-weight:700" onclick="saveNew(this)">Add to queue</button>
      <button class="notesave" onclick="document.getElementById('newModal').style.display='none'">Cancel</button>
    </div>
  </div>
</div>

<script>
let DATA=[], FILTER='open';
const STATUSES=['new','contacted','scheduled','intaked','closed'];
const CHECKS=['Insurance verified','Callback made','Assessment scheduled','ROI signed','Docs collected'];

function openNew(){
  ['n_first','n_last','n_phone','n_email','n_ref','n_sub','n_msg'].forEach(i=>{const e=document.getElementById(i);if(e)e.value='';});
  document.getElementById('newModal').style.display='block';
}
async function saveNew(btn){
  const v=id=>{const e=document.getElementById(id);return e?e.value:'';};
  const body={create:true,first_name:v('n_first'),last_name:v('n_last'),phone:v('n_phone'),email:v('n_email'),
    source:v('n_source'),referred_by:v('n_ref'),reaching_as:v('n_as'),insurance:v('n_ins'),
    needs_housing:v('n_house'),probation_parole:v('n_prob'),primary_substance:v('n_sub'),
    last_use:v('n_use'),best_time:v('n_time'),message:v('n_msg')};
  if(!body.first_name&&!body.phone){alert('Add at least a name or a phone number');return;}
  btn.textContent='Adding…';
  try{
    const r=await fetch('/intake-queue/update',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    btn.textContent='Add to queue';
    if(r.ok){document.getElementById('newModal').style.display='none';location.reload();}else{alert('Could not add');}
  }catch(_){btn.textContent='Add to queue';alert('Could not add');}
}

async function toggleCheck(id,c,el){
  const row=DATA.find(r=>r.id===id); if(!row) return;
  let list=(row.checks||'').split('|').filter(Boolean);
  if(el.checked){ if(list.indexOf(c)<0) list.push(c); } else { list=list.filter(x=>x!==c); }
  row.checks=list.join('|');
  try{ await fetch('/intake-queue/update',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,checks:row.checks})}); }catch(_){ el.checked=!el.checked; }
}
async function saveNotes(id,btn){
  const val=document.getElementById('notes-'+id).value;
  btn.textContent='Saving…';
  try{
    const res=await fetch('/intake-queue/update',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,notes:val})});
    const row=DATA.find(r=>r.id===id); if(row) row.notes=val;
    btn.textContent=res.ok?'Saved ✓':'Retry';
  }catch(_){ btn.textContent='Retry'; }
  setTimeout(()=>{btn.textContent='Save note';},2000);
}
async function delRow(id,btn){
  if(!confirm('Delete this intake request permanently? This cannot be undone.')) return;
  btn.textContent='…';
  try{
    const res=await fetch('/intake-queue/update',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,del:true})});
    if(res.ok){ DATA=DATA.filter(r=>r.id!==id); render(); } else { btn.textContent='Retry'; }
  }catch(_){ btn.textContent='Retry'; }
}

function isReady(r){
  const c=(r.checks||'');
  return c.indexOf('Insurance verified')>-1 && c.indexOf('Assessment scheduled')>-1;
}
function updateStats(){
  const open=DATA.filter(r=>(r.status||'new')!=='closed');
  document.getElementById('qNew').textContent=DATA.filter(r=>(r.status||'new')==='new').length;
  document.getElementById('qHot').textContent=open.filter(r=>triage(r).some(x=>x.c==='hot')).length;
  document.getElementById('qReady').textContent=open.filter(r=>isReady(r)&&(r.status||'new')!=='intaked').length;
  document.getElementById('qIntaked').textContent=DATA.filter(r=>(r.status||'new')==='intaked').length;
  document.getElementById('qstats').style.display='grid';
}
function copySummary(id,btn){
  const r=DATA.find(x=>x.id===id); if(!r) return;
  const L=[];
  L.push('PRE-INTAKE SUMMARY — '+((r.first_name||'')+' '+(r.last_name||'')).trim());
  if(r.phone)L.push('Phone: '+r.phone);
  if(r.email)L.push('Email: '+r.email);
  L.push('Reaching out as: '+(r.reaching_as==='family'?'Family member':'Self'));
  if(r.insurance)L.push('Insurance: '+r.insurance+(r.insurance_company?(' — '+r.insurance_company):''));
  if(r.needs_housing)L.push('Housing needed: '+r.needs_housing);
  if(r.probation_parole)L.push('Probation/parole: '+r.probation_parole);
  if(r.primary_substance)L.push('Primary substance: '+r.primary_substance);
  if(r.last_use)L.push('Last use: '+r.last_use);
  if(r.best_time)L.push('Best time: '+r.best_time);
  if(r.motivation)L.push('Motivation: '+r.motivation);
  if(r.message)L.push('Message: '+r.message);
  if(r.checks)L.push('Completed: '+r.checks.split('|').join(', '));
  if(r.notes)L.push('Notes: '+r.notes);
  L.push('Status: '+(r.status||'new'));
  navigator.clipboard.writeText(L.join('\n')).then(()=>{btn.textContent='Copied ✓';setTimeout(()=>{btn.textContent='Copy summary';},2000);});
}
function esc(t){const d=document.createElement('div');d.textContent=t||'';return d.innerHTML;}
function fmtWhen(iso){
  try{const d=new Date(iso);
    return d.toLocaleDateString('en-US',{month:'short',day:'numeric'})+' · '+d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
  }catch(_){return '';}
}

/* Rule-based triage — flags for Bailey, no AI, human makes every call */
function triage(r){
  const f=[];
  const lu=(r.last_use||'').toLowerCase();
  if(lu==='today'||lu==='this week') f.push({c:'hot',t:'Reach out within 24h — recent use'});
  if((r.needs_housing||'').toLowerCase()==='yes') f.push({c:'warm',t:'Housing needed'});
  if((r.probation_parole||'').toLowerCase()==='yes') f.push({c:'warm',t:'Probation / parole'});
  const ins=(r.insurance||'').toLowerCase();
  if(ins==='no insurance') f.push({c:'info',t:'Uninsured — funding convo'});
  else if(ins==='not sure') f.push({c:'info',t:'Insurance unverified'});
  if(r.reaching_as==='family') f.push({c:'info',t:'Family reaching out'});
  const missing=[];
  if(!r.insurance) missing.push('insurance');
  if(!r.phone) missing.push('phone');
  if(!r.last_use) missing.push('last use');
  if(missing.length) f.push({c:'info',t:'Missing: '+missing.join(', ')});
  return f;
}

function render(){
  try{updateStats();}catch(_){}
  const grid=document.getElementById('grid');
  const note=document.getElementById('note');
  let rows=DATA;
  if(FILTER==='open') rows=DATA.filter(r=>(r.status||'new')!=='closed');
  else if(FILTER!=='all') rows=DATA.filter(r=>(r.status||'new')===FILTER);
  document.getElementById('count').textContent=rows.length+' of '+DATA.length;
  if(!rows.length){grid.innerHTML='';note.style.display='block';note.textContent='Nothing here — the queue is clear.';return;}
  note.style.display='none';
  grid.innerHTML=rows.map(r=>{
    const flags=triage(r);
    const hot=flags.some(x=>x.c==='hot');
    const line=(l,v)=>v?('<div><b>'+l+':</b> '+esc(v)+'</div>'):'';
    const done=(r.checks||'').split('|').filter(Boolean).length;
    const pct=Math.round(done/CHECKS.length*100);
    const ready=isReady(r);
    return '<div class="card'+(hot?' priority':'')+'">'
      +'<div class="chead"><div class="cname">'+esc(((r.first_name||'')+' '+(r.last_name||'')).trim()||'(no name)')+'</div>'
      +'<div class="cwhen">'+fmtWhen(r.created_at)+'</div></div>'
      +'<div class="pbar" title="'+done+' of '+CHECKS.length+' steps done"><i style="width:'+pct+'%"></i></div>'
      +((ready&&(r.status||'new')!=='intaked')?'<div class="flags"><span class="flag ready">&#10003; Ready for intake</span></div>':'')
      +(flags.length?'<div class="flags">'+flags.map(x=>'<span class="flag '+x.c+'">'+esc(x.t)+'</span>').join('')+'</div>':'')
      +'<div class="rows">'
      +line('Phone', r.phone?null:null)
      +(r.phone?('<div><b>Phone:</b> <a href="tel:'+esc(r.phone.replace(/[^0-9+]/g,''))+'">'+esc(r.phone)+'</a></div>'):'')
      +(r.email?('<div><b>Email:</b> <a href="mailto:'+esc(r.email)+'">'+esc(r.email)+'</a></div>'):'')
      +line('Reaching out as', r.reaching_as==='family'?'Family member':'Self')
      +line('Came from', r.source? (r.source+(r.referred_by?(' — '+r.referred_by):'')) : null)
      +line('Insurance', [r.insurance,r.insurance_company].filter(Boolean).join(' — '))
      +line('Housing needed', r.needs_housing)
      +line('Probation / parole', r.probation_parole)
      +line('Primary substance', r.primary_substance)
      +line('Last use', r.last_use)
      +line('Best time to call', r.best_time)
      +line('Motivation', r.motivation)
      +'</div>'
      +(r.message?('<div class="msg">&ldquo;'+esc(r.message)+'&rdquo;</div>'):'')
      +'<div class="cklist">'+CHECKS.map(c=>{
        const on=(r.checks||'').split('|').indexOf(c)>-1;
        return '<label><input type="checkbox" '+(on?'checked ':'')+'onchange="toggleCheck(\''+r.id+'\',\''+c+'\',this)">'+c+'</label>';
      }).join('')+'</div>'
      +'<textarea class="notesbox" id="notes-'+r.id+'" placeholder="Notes for this intake…">'+esc(r.notes||'')+'</textarea>'
      +'<div style="display:flex;gap:.4rem;align-items:center">'
      +'<button class="notesave" onclick="saveNotes(\''+r.id+'\',this)">Save note</button>'
      +'<button class="delbtn" onclick="delRow(\''+r.id+'\',this)">Delete</button>'
      +'</div>'
      +'<div class="status-row">'+STATUSES.map(st=>
        '<button class="sbtn'+((r.status||'new')===st?' on':'')+'" onclick="setStatus(\''+r.id+'\',\''+st+'\',this)">'+st+'</button>'
      ).join('')+'</div>'
      +'</div>';
  }).join('');
}

async function setStatus(id,status,btn){
  btn.textContent='…';
  try{
    const res=await fetch('/intake-queue/update',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,status})});
    if(res.ok){const row=DATA.find(r=>r.id===id);if(row)row.status=status;render();}
    else{btn.textContent='retry';}
  }catch(_){btn.textContent='retry';}
}

document.getElementById('filters').addEventListener('click',e=>{
  const b=e.target.closest('.fbtn');if(!b)return;
  FILTER=b.dataset.f;
  document.querySelectorAll('.fbtn').forEach(x=>x.classList.toggle('active',x===b));
  render();
});

(async function(){
  const note=document.getElementById('note');
  try{
    const res=await fetch('/intake-queue/list');
    if(res.status===401){
      note.innerHTML='This page must be protected by <b>Cloudflare Access</b> before it will load data.<br><br>In Cloudflare: Zero Trust &rarr; Access &rarr; Applications &rarr; Add application (self-hosted) &rarr; path <code>/intake-queue</code> &rarr; policy allowing the intake team\'s emails. Then reload and log in.';
      return;
    }
    const data=await res.json();
    if(data.error){note.textContent='Error: '+data.error;return;}
    DATA=data.requests||[];
    document.getElementById('viewer').textContent='Signed in as '+(data.viewer||'');
    document.getElementById('filters').style.display='flex';
    render();
  }catch(_){note.textContent='Could not load the queue. Check your connection and reload.';}
})();
</script>
</body>
</html>
