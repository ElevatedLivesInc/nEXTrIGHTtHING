<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Starfish Wall · Flannel to Formal Masquerade</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Raleway:wght@500;700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:radial-gradient(120% 90% at 50% 0%,#3b1a6b 0%,#140a2e 55%,#050310 100%);color:#efe7ff;font-family:Raleway,Arial,sans-serif;overflow:hidden}
.top{display:flex;align-items:center;justify-content:space-between;padding:2vh 3vw 1vh}
h1{margin:0;font-family:'Cormorant Garamond',serif;font-size:5.2vh;color:#e6cf9b;font-weight:700}
.sub{font-size:2.1vh;color:#cdbdf2;margin-top:.4vh}
.count{text-align:right}.count b{display:block;font-family:'Cormorant Garamond',serif;font-size:8vh;line-height:1;color:#fff6dc;text-shadow:0 0 24px rgba(230,207,155,.7)}.count span{font-size:2vh;color:#cdbdf2;letter-spacing:.15em;text-transform:uppercase}
.wall{position:absolute;left:3vw;right:20vw;top:15vh;bottom:4vh;display:grid;gap:.4vh;align-content:center}
.sf{position:relative}.sf svg{width:100%;height:100%;display:block}
.sf .body{fill:rgba(185,167,232,.12);stroke:rgba(185,167,232,.3);stroke-width:1.2}.sf .dots{fill:rgba(255,255,255,.1)}
.sf.lit .body{fill:url(#sfg);stroke:#f5e3b3;stroke-width:1}.sf.lit .dots{fill:rgba(255,255,255,.85)}
.sf.lit svg{filter:drop-shadow(0 0 6px rgba(230,207,155,.85)) drop-shadow(0 0 16px rgba(185,140,255,.6));animation:tw 3.2s ease-in-out infinite;animation-delay:var(--d,0s)}
.sf.new svg{animation:pop 1.2s ease-out 1,tw 3.2s ease-in-out 1.2s infinite}
@keyframes tw{0%,100%{filter:drop-shadow(0 0 5px rgba(230,207,155,.7)) drop-shadow(0 0 12px rgba(185,140,255,.45))}50%{filter:drop-shadow(0 0 10px rgba(255,236,190,1)) drop-shadow(0 0 24px rgba(185,140,255,.85))}}
@keyframes pop{0%{transform:scale(.3) rotate(-60deg);opacity:.2}70%{transform:scale(1.4) rotate(10deg);opacity:1}100%{transform:scale(1)}}
.side{position:absolute;right:3vw;top:15vh;bottom:4vh;width:15vw;display:flex;flex-direction:column;align-items:center;gap:2vh;text-align:center}
.qr{width:13vw;height:13vw;border-radius:1vw;box-shadow:0 0 30px rgba(230,207,155,.4);background:#fff;padding:.8vw;box-sizing:border-box}.qr canvas,.qr img{width:100%!important;height:100%!important;display:block}
.cta{font-family:'Cormorant Garamond',serif;font-size:3.2vh;color:#e6cf9b;line-height:1.15}
.price{font-size:2vh;color:#efe7ff}
.feed{margin-top:1vh;width:100%;font-family:'Cormorant Garamond',serif;font-size:2.6vh;color:#fff6dc;line-height:1.3;overflow:hidden;flex:1}
.feed div{padding:.6vh 0;border-top:1px solid rgba(230,207,155,.2)}
</style></head><body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><radialGradient id="sfg" cx="50%" cy="45%" r="60%"><stop offset="0" stop-color="#fff6dc"/><stop offset=".45" stop-color="#e6cf9b"/><stop offset="1" stop-color="#a77ee0"/></radialGradient></defs></svg>
<div class="top"><div><h1>The Starfish Wall</h1><div class="sub">&ldquo;It made a difference to that one.&rdquo; &nbsp;·&nbsp; Benefiting The Right Thing in Recovery</div></div>
<div class="count"><b id="n">0</b><span>starfish lit</span></div></div>
<div class="wall" id="wall"></div>
<div class="side"><div class="qr" id="qr"></div>
<div class="cta">Scan to light<br>a starfish</div><div class="price">$5 for one · $20 for five</div><div class="feed" id="feed"></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
(function(){
  try{ new QRCode(document.getElementById('qr'),{text:'https://nextrighthing.com/masquerade/#starfish',width:512,height:512,colorDark:'#1a0b33',colorLight:'#ffffff'}); }catch(e){}
  var URL='https://uhnytejrlfummcrwdeij.supabase.co', KEY='sb_publishable_0x4W8Ja8S_PrwAQ6egq0-Q_D4XH8PFY';
  var SV='<svg viewBox="0 0 100 100"><path class="body" d="M50 4c4 0 6 9 9 21 2 8 4 11 12 12 13 2 25 4 26 9 1 4-8 9-19 16-7 4-8 8-6 16 3 13 6 22 2 25-4 2-12-4-21-12-5-5-9-5-14 0-9 8-17 14-21 12-4-3-1-12 2-25 2-8 1-12-6-16C3 55-6 50-5 46c1-5 13-7 26-9 8-1 10-4 12-12C36 13 38 4 42 4z" transform="translate(4 2) scale(.92)"/><g class="dots"><circle cx="50" cy="22" r="2.2"/><circle cx="50" cy="34" r="2.6"/><circle cx="72" cy="44" r="2.2"/><circle cx="28" cy="44" r="2.2"/><circle cx="62" cy="68" r="2.2"/><circle cx="38" cy="68" r="2.2"/><circle cx="50" cy="50" r="3.4"/></g></svg>';
  var wall=document.getElementById('wall'), prev=null;
  function draw(list){
    var lit={}; list.forEach(function(x){ lit[x.slot]=x.label; });
    var max=0; for(var k in lit) if(+k>max) max=+k;
    var N=Math.max(120, Math.ceil((Object.keys(lit).length+40)/20)*20, Math.ceil((max+10)/20)*20);
    var W=wall.clientWidth, H=wall.clientHeight, cols=Math.max(8,Math.round(Math.sqrt(N*W/H))), rows=Math.ceil(N/cols), size=Math.floor(Math.min(W/cols,H/rows));
    wall.style.gridTemplateColumns='repeat('+cols+','+size+'px)'; wall.style.gridAutoRows=size+'px'; wall.style.justifyContent='center';
    var h=''; for(var i=1;i<=N;i++){ var isNew=prev&&lit[i]&&!prev[i]; h+='<div class="sf'+(lit[i]?' lit':'')+(isNew?' new':'')+'" style="--d:'+((i*37)%32)/10+'s">'+SV+'</div>'; }
    wall.innerHTML=h; document.getElementById('n').textContent=Object.keys(lit).length;
    var names=[], seen={}; list.slice().reverse().forEach(function(x){ if(!seen[x.label]){ seen[x.label]=1; names.push(x.label); } });
    document.getElementById('feed').innerHTML=names.slice(0,12).map(function(t){ return '<div>✦ '+String(t).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];})+'</div>'; }).join('');
    prev=lit;
  }
  function load(){ fetch(URL+'/rest/v1/rpc/gala_stars_public',{method:'POST',headers:{apikey:KEY,authorization:'Bearer '+KEY,'content-type':'application/json'},body:JSON.stringify({p_slug:'masquerade-2026'})}).then(function(r){return r.json();}).then(function(a){ draw(a||[]); }).catch(function(){}); }
  load(); setInterval(load,15000); window.addEventListener('resize',function(){ prev=null; load(); });
})();
</script>
</body></html>
