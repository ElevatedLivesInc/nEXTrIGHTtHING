<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="{{COLOR_NAVY_DEEP}}">
<title>Rounds — {{ORG_NAME}}</title>
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23121c33'/><text y='68' x='50' font-size='58' text-anchor='middle' fill='%23c9a96e' font-family='Georgia'>N</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,400&family=Raleway:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  :root{--navy:{{COLOR_NAVY}};--deep:{{COLOR_NAVY_DEEP}};--sand:{{COLOR_SAND}};--sandl:{{COLOR_SAND_LIGHT}};--line:rgba(201,169,110,.22);
        --ok:#9fd8b0;--warn:#f0d9a0;--bad:#f0b6b6;}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  body{background:var(--deep);color:#fff;font-family:'Raleway',sans-serif;
       padding:0 0 calc(6rem + env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased;}
  .top{position:sticky;top:0;z-index:20;background:rgba(18,28,51,.96);backdrop-filter:blur(10px);
       border-bottom:1px solid var(--line);padding:calc(.7rem + env(safe-area-inset-top)) .9rem .7rem;}
  .tline{display:flex;align-items:baseline;justify-content:space-between;gap:.6rem;}
  h1{font-family:'Cormorant Garamond',serif;font-weight:300;font-size:1.45rem;}
  h1 em{color:var(--sandl);font-style:italic;}
  .who{font-size:.66rem;color:rgba(255,255,255,.42);}
  .mc{font-size:.66rem;letter-spacing:.03em;color:var(--sandl);text-decoration:none;
      border:1px solid var(--line);border-radius:50px;padding:.22rem .65rem;white-space:nowrap;}
  .bar{height:5px;background:rgba(255,255,255,.08);border-radius:5px;margin-top:.6rem;overflow:hidden;}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--sand),var(--sandl));transition:width .45s;}
  .prog{font-size:.7rem;color:rgba(255,255,255,.55);margin-top:.35rem;letter-spacing:.03em;}
  .houses{display:flex;gap:.4rem;overflow-x:auto;padding:.7rem .9rem;scrollbar-width:none;}
  .houses::-webkit-scrollbar{display:none;}
  .hchip{flex:0 0 auto;padding:.5rem .95rem;border-radius:50px;border:1px solid var(--line);
         background:transparent;color:rgba(255,255,255,.72);font-size:.76rem;font-family:'Raleway',sans-serif;
         white-space:nowrap;cursor:pointer;}
  .hchip.on{background:rgba(201,169,110,.22);color:#fff;border-color:rgba(201,169,110,.6);}
  .hchip b{color:var(--sandl);}
  .wrap{padding:0 .9rem;}
  .card{border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.025);
        padding:.9rem;margin-bottom:.7rem;transition:opacity .3s,transform .3s;}
  .card.seen{opacity:.42;}
  .card.flag{border-color:rgba(240,182,182,.5);background:rgba(240,182,182,.05);}
  .chead{display:flex;justify-content:space-between;align-items:flex-start;gap:.6rem;}
  .nm{font-family:'Cormorant Garamond',serif;font-size:1.3rem;color:#fff;line-height:1.2;}
  .rm{font-size:.72rem;color:rgba(255,255,255,.5);margin-top:.15rem;}
  .bal{font-size:1.05rem;font-weight:700;white-space:nowrap;}
  .bal.owe{color:var(--bad);} .bal.ok{color:var(--ok);}
  .chips{display:flex;flex-wrap:wrap;gap:.3rem;margin:.6rem 0 .1rem;}
  .c{font-size:.62rem;letter-spacing:.06em;text-transform:uppercase;padding:.2rem .55rem;border-radius:50px;border:1px solid;}
  .c.w{color:var(--warn);border-color:rgba(240,217,160,.45);}
  .c.b{color:var(--bad);border-color:rgba(240,182,182,.5);}
  .c.g{color:var(--ok);border-color:rgba(159,216,176,.45);}
  .acts{display:grid;grid-template-columns:repeat(4,1fr);gap:.4rem;margin-top:.75rem;}
  .a{padding:.75rem .2rem;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.04);
     color:rgba(255,255,255,.85);font-size:.68rem;font-family:'Raleway',sans-serif;font-weight:600;
     letter-spacing:.02em;cursor:pointer;line-height:1.25;min-height:52px;}
  .a:active{transform:scale(.94);}
  .a.g{border-color:rgba(159,216,176,.4);color:var(--ok);}
  .a.b{border-color:rgba(240,182,182,.45);color:var(--bad);}
  .a.s{border-color:rgba(201,169,110,.55);background:rgba(201,169,110,.15);color:var(--sandl);}
  .a[disabled]{opacity:.45;}
  .sub{font-size:.74rem;color:rgba(255,255,255,.62);margin-top:.55rem;line-height:1.6;}
  .done{text-align:center;padding:3rem 1rem;color:rgba(255,255,255,.55);}
  .done b{display:block;font-family:'Cormorant Garamond',serif;font-size:1.7rem;color:var(--sandl);
          font-weight:300;margin-bottom:.5rem;}
  .foot{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(18,28,51,.97);
        backdrop-filter:blur(10px);border-top:1px solid var(--line);
        padding:.7rem .9rem calc(.7rem + env(safe-area-inset-bottom));display:flex;gap:.6rem;align-items:center;}
  .foot .n{flex:1;font-size:.78rem;color:rgba(255,255,255,.7);line-height:1.4;}
  .foot .n b{color:var(--sandl);}
  .btn{background:linear-gradient(145deg,var(--sandl),var(--sand));color:var(--navy);font-weight:700;
       border:none;border-radius:9px;padding:.7rem 1.1rem;font-size:.8rem;font-family:'Raleway',sans-serif;cursor:pointer;}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:rgba(255,255,255,.7);font-weight:400;}
  .toast{position:fixed;left:50%;transform:translateX(-50%) translateY(120%);bottom:calc(5.4rem + env(safe-area-inset-bottom));
         background:var(--navy);border:1px solid var(--line);border-radius:10px;padding:.65rem 1.1rem;
         font-size:.8rem;z-index:40;transition:transform .28s;max-width:90vw;text-align:center;}
  .toast.up{transform:translateX(-50%) translateY(0);}
  .note{border:1px dashed var(--line);border-radius:12px;padding:2rem 1rem;text-align:center;
        color:rgba(255,255,255,.5);font-size:.86rem;line-height:1.7;}
  a{color:var(--sand);}
</style>
</head>
<body>
<div class="top">
  <div class="tline"><h1>Rounds<em>.</em></h1><div style="display:flex;align-items:center;gap:.5rem"><span class="who" id="who"></span><a href="/mission-control" class="mc">&larr; Mission Control</a></div></div>
  <div class="bar"><i id="pbar" style="width:0%"></i></div>
  <div class="prog" id="prog">Loading…</div>
</div>
<div class="houses" id="houses"></div>
<div class="wrap"><div id="list"></div></div>
<div class="foot" id="foot" style="display:none">
  <div class="n" id="next"></div>
  <button class="btn ghost" onclick="toggleSeen()" id="seenBtn">Show done</button>
</div>
<div class="toast" id="toast"></div>

<script>
let RES=[],HOUSES=[],HOUSE='',SHOW_SEEN=false,BUSY={};
const g=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const n=v=>Number(v)||0;
const money=v=>'$'+n(v).toLocaleString('en-US',{maximumFractionDigits:0});
const bal=r=>n(r.past_due)+n(r.current_due)-n(r.amount_paid);
const isOpen=r=>(r.status||'')==='open';
const today=()=>new Date().toISOString().slice(0,10);
function daysAgo(d){if(!d)return null;try{return Math.floor((new Date()-new Date(d+'T00:00:00'))/86400000);}catch(_){return null;}}
function ago(d){const x=daysAgo(d);if(x===null)return 'never';if(x===0)return 'today';if(x===1)return 'yesterday';return x+'d ago';}

/* Seen today = talked to today. That is the whole definition of a round: did
   a human lay eyes on this person and say something to them. Everything else
   on this screen is context for that one act. */
const seen=r=>r.last_talked===today();

/* Why this person needs you, in one line, ordered by what actually matters.
   A man who has not been spoken to in three weeks outranks an unpaid balance,
   because the balance is usually a symptom of the silence. */
function why(r){
  if(r.on_notice) return {t:'On notice'+(r.warning_reason?' — '+r.warning_reason:''),k:'b'};
  const q=daysAgo(r.last_talked);
  if(q===null) return {t:'Never been talked to',k:'b'};
  if(q>14) return {t:'No contact in '+q+' days',k:'b'};
  const u=daysAgo(r.last_ua);
  if(u===null||u>30) return {t:'UA overdue — '+(u===null?'none on record':u+' days'),k:'w'};
  if(bal(r)>=1500) return {t:money(bal(r))+' behind',k:'w'};
  if(q>7) return {t:'Getting quiet — '+q+' days',k:'w'};
  return null;
}

function chips(r){
  const out=[];
  const b=bal(r);
  if(r.on_notice) out.push(['ON NOTICE','b']);
  if(n(r.warnings)>0) out.push([r.warnings+' warning'+(r.warnings==1?'':'s'),'w']);
  const u=daysAgo(r.last_ua);
  if(u===null) out.push(['NO UA ON RECORD','w']); else if(u>30) out.push(['UA '+u+'D AGO','w']);
  else if(r.ua_result) out.push(['UA '+String(r.ua_result==='clean'?'negative':r.ua_result==='dirty'?'positive':r.ua_result).toUpperCase(),(r.ua_result==='positive'||r.ua_result==='dirty')?'b':'g']);
  const hm=n(r.house_meetings);
  if(hm<2) out.push([hm+' HOUSE MTG','w']); else out.push([hm+' HOUSE MTG','g']);
  if(b<=0) out.push(['CURRENT','g']);
  return out;
}

function render(){
  const all=RES.filter(r=>!isOpen(r)&&!r.move_out_date&&(!HOUSE||r.house_name===HOUSE));
  const left=all.filter(r=>!seen(r));
  const show=SHOW_SEEN?all:left;

  const total=all.length, doneN=total-left.length;
  g('pbar').style.width=(total?Math.round(doneN/total*100):0)+'%';
  g('prog').textContent=total? (doneN+' of '+total+' seen today'+(HOUSE?' · '+HOUSE:' · all houses')) : 'Nobody to see here';

  // house chips carry their own remaining count so Rob picks the next house
  // without opening it first
  g('houses').innerHTML=[['','All']].concat(HOUSES.map(h=>[h.name,h.name])).map(([v,label])=>{
    const rem=RES.filter(r=>!isOpen(r)&&!r.move_out_date&&(!v||r.house_name===v)&&!seen(r)).length;
    return '<button class="hchip'+(HOUSE===v?' on':'')+'" onclick="pick(\''+esc(v).replace(/'/g,"\\'")+'\')">'+esc(label)+' <b>'+rem+'</b></button>';
  }).join('');

  if(!show.length){
    g('list').innerHTML='<div class="done"><b>'+(total?'Round complete.':'Nothing here.')+'</b>'
      +(total?'Every person in '+(HOUSE||'every house')+' has been talked to today.<br>That has not always been true.':'No active residents in this house.')
      +(left.length===0&&total?'<div style="margin-top:1.2rem"><button class="btn ghost" onclick="toggleSeen()">'+(SHOW_SEEN?'Hide done':'Show everyone')+'</button></div>':'')+'</div>';
  } else {
    show.sort((a,b)=>{
      const wa=why(a),wb=why(b);
      const s=x=>x?(x.k==='b'?0:1):2;
      if(s(wa)!==s(wb))return s(wa)-s(wb);
      return (daysAgo(b.last_talked)||9999)-(daysAgo(a.last_talked)||9999);
    });
    g('list').innerHTML=show.map(r=>{
      const w=why(r), b=bal(r), busy=BUSY[r.id];
      return '<div class="card'+(seen(r)?' seen':'')+(w&&w.k==='b'?' flag':'')+'" id="c-'+r.id+'">'
      +'<div class="chead"><div><div class="nm">'+esc(r.name||'—')+'</div>'
      +'<div class="rm">'+esc(r.house_name||'')+(r.room?' · Room '+esc(r.room):'')+' · talked '+ago(r.last_talked)+'</div></div>'
      +'<div class="bal '+(b>0?'owe':'ok')+'">'+(b>0?money(b):'current')+'</div></div>'
      +(w?'<div class="sub" style="color:'+(w.k==='b'?'var(--bad)':'var(--warn)')+'">'+esc(w.t)+'</div>':'')
      +'<div class="chips">'+chips(r).map(c=>'<span class="c '+c[1]+'">'+esc(c[0])+'</span>').join('')+'</div>'
      +'<div class="acts">'
      +act(r,'talked','Talked','s',busy)
      +act(r,'house_meeting','House<br>mtg','',busy)
      +act(r,'ua_negative','UA<br>neg','g',busy)
      +act(r,'ua_positive','UA<br>pos','b',busy)
      +'</div>'
      +'<div class="acts" style="margin-top:.4rem">'
      +act(r,'peer_meeting','Peer<br>mtg','',busy)
      +act(r,'warn','Warning','b',busy)
      +act(r,'notice',(r.on_notice?'Off<br>notice':'On<br>notice'),'b',busy)
      +'<button class="a" onclick="pay(\''+r.id+'\')"'+(busy?' disabled':'')+'>Take<br>payment</button>'
      +'</div></div>';
    }).join('');
  }

  const nx=left[0];
  g('foot').style.display=total?'flex':'none';
  g('seenBtn').textContent=SHOW_SEEN?'Hide done':'Show done';
  g('next').innerHTML=left.length
    ? '<b>'+left.length+' left</b>'+(nx?' · next up: '+esc(nx.name||'')+(nx.room?' (Room '+esc(nx.room)+')':''):'')
    : '<b>All seen.</b> Nice work.';
}
function act(r,kind,label,cls,busy){
  return '<button class="a '+cls+'" onclick="tap(\''+r.id+'\',\''+kind+'\',this)"'+(busy?' disabled':'')+'>'+label+'</button>';
}
function pick(h){HOUSE=h;render();window.scrollTo({top:0,behavior:'smooth'});}
function toggleSeen(){SHOW_SEEN=!SHOW_SEEN;render();}

let tmr;
function toast(msg){const t=g('toast');t.textContent=msg;t.classList.add('up');clearTimeout(tmr);tmr=setTimeout(()=>t.classList.remove('up'),2200);}

/* Optimistic: the card updates the instant it is tapped, then the server
   catches up. Rob is standing in a hallway with one bar of signal - waiting
   on a round trip before the button responds is how an app gets abandoned. */
async function tap(id,kind,btn){
  const r=RES.find(x=>x.id===id); if(!r||BUSY[id])return;
  BUSY[id]=true; btn.disabled=true;
  const before=JSON.parse(JSON.stringify(r));
  const t=today();
  if(kind==='talked'){r.last_talked=t;}
  else if(kind==='house_meeting'){r.house_meetings=n(r.house_meetings)+1;r.last_meeting=t;r.last_talked=t;}
  else if(kind==='peer_meeting'){r.peer_meetings=n(r.peer_meetings)+1;r.last_meeting=t;r.last_talked=t;}
  else if(kind==='ua_negative'){r.last_ua=t;r.ua_result='negative';r.last_talked=t;}
  else if(kind==='ua_positive'){r.last_ua=t;r.ua_result='positive';r.last_talked=t;}
  else if(kind==='warn'){r.warnings=n(r.warnings)+1;r.last_warning=t;r.last_talked=t;}
  else if(kind==='notice'){r.on_notice=!r.on_notice;r.last_talked=t;}
  render();
  const label={talked:'Logged',house_meeting:'House meeting',peer_meeting:'Peer meeting',
    ua_negative:'UA negative',ua_positive:'UA positive',warn:'Warning',notice:'Notice'}[kind];
  try{
    const body={quick:kind==='talked'?'talked':kind,id:id,resident_name:r.name,house_name:r.house_name};
    const res=await fetch('/housing/update',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    const d=await res.json().catch(()=>({}));
    if(!res.ok||d.ok===false) throw new Error(d.error||'failed');
    if(d.resident) Object.assign(r,d.resident);
    toast(label+' · '+(r.name||''));
  }catch(_){
    Object.assign(r,before);
    toast('Did not save — check signal and try again');
  }
  BUSY[id]=false; render();
}

async function pay(id){
  const r=RES.find(x=>x.id===id); if(!r)return;
  const amt=prompt('How much did '+(r.name||'they')+' pay?\n\nBalance right now: '+money(bal(r)));
  if(amt===null)return;
  const val=Number(String(amt).replace(/[^0-9.]/g,''));
  if(!val){toast('No amount entered');return;}
  const how=prompt('How? cash / card / check / money order / transfer','cash')||'';
  BUSY[id]=true; render();
  try{
    const res=await fetch('/housing/update',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({event:true,resident_id:id,resident_name:r.name,house_name:r.house_name,
        kind:'payment',amount:val,detail:'Taken on rounds',paid_on:today(),method:how.trim().toLowerCase(),taken_by:''})});
    if(!res.ok) throw new Error('failed');
    r.amount_paid=n(r.amount_paid)+val; r.last_talked=today();
    toast(money(val)+' from '+(r.name||'')+' · logged');
  }catch(_){ toast('Payment did not save — try again'); }
  BUSY[id]=false; render();
}

function welcome(status){
  g('prog').textContent='';
  g('list').innerHTML='<div class="note">'
    +(status===403?'<b style="color:{{COLOR_SAND_LIGHT}}">This one is not yours.</b><br>Your account is not set up for Housing.'
      :'<b style="color:{{COLOR_SAND_LIGHT}}">Sign in to start your round.</b><br>Use your @{{EMAIL_DOMAIN}} address.'
      +'<div style="margin-top:1.2rem"><a href="/signin?next=%2Frounds" class="btn" style="text-decoration:none;display:inline-block">Sign in</a></div>')
    +'</div>';
}

async function load(){
  try{
    const res=await fetch('/housing/list');
    if(res.status===401||res.status===403){welcome(res.status);return;}
    const d=await res.json();
    if(d.error){g('prog').textContent='';g('list').innerHTML='<div class="note">'+esc(d.error)+'</div>';return;}
    RES=d.residents||[];HOUSES=d.houses||[];
    g('who').textContent=(d.viewer||'').split('@')[0];
    render();
  }catch(_){ g('prog').textContent=''; g('list').innerHTML='<div class="note">Could not load. Check your signal and pull to refresh.</div>'; }
}
load();
</script>
<script src="/assistant-widget.js" data-module="rounds" defer></script>
</body>
</html>
