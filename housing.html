<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Housing Command — Staff Only</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=Raleway:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  :root{--navy:#1a2744;--navy-deep:#121c33;--sand:#c9a96e;--sand-light:#e8d5b0;--lav:#c9b6f0;--good:#78c896;--bad:#e07878;--warn:#e0965a;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--navy-deep);color:#fff;font-family:'Raleway',sans-serif;min-height:100vh;}
  .top{background:var(--navy);border-bottom:2px solid rgba(201,169,110,.5);padding:1.3rem 1.5rem;}
  .top-inner{max-width:1280px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;}
  h1{font-family:'Cormorant Garamond',serif;font-weight:400;font-size:1.7rem;}
  h1 em{color:var(--sand-light);font-style:italic;}
  .viewer{font-size:.72rem;color:rgba(255,255,255,.5);}
  .viewer a{color:var(--sand-light);text-decoration:none;margin-left:1rem;}
  .wrap{max-width:1280px;margin:0 auto;padding:1.4rem 1.5rem 3rem;}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.8rem;margin-bottom:1.3rem;}
  .stat{background:rgba(255,255,255,.04);border:1px solid rgba(201,169,110,.25);border-radius:10px;padding:.95rem 1rem;text-align:center;}
  .stat .n{font-family:'Cormorant Garamond',serif;font-size:1.9rem;color:var(--sand-light);}
  .stat .l{font-size:.57rem;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.5);margin-top:.2rem;}
  .stat.bad{border-color:rgba(224,120,120,.5);} .stat.bad .n{color:#f0b6b6;}
  .stat.warn{border-color:rgba(224,150,90,.5);} .stat.warn .n{color:#f3c48f;}
  .tabs{display:flex;gap:.5rem;margin-bottom:1.2rem;flex-wrap:wrap;align-items:center;}
  .tab{padding:.48rem 1.2rem;border-radius:50px;border:1px solid rgba(201,169,110,.35);background:transparent;color:rgba(255,255,255,.7);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;font-family:'Raleway',sans-serif;}
  .tab.active{background:rgba(201,169,110,.2);color:var(--sand-light);border-color:rgba(201,169,110,.6);}
  #q{margin-left:auto;padding:.45rem .9rem;border-radius:6px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.05);color:#fff;font-family:'Raleway',sans-serif;font-size:.8rem;min-width:220px;}
  /* WAR MAP */
  .houses{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:1rem;}
  .house{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:1.1rem 1.2rem;}
  .hhead{display:flex;justify-content:space-between;align-items:baseline;gap:.6rem;margin-bottom:.6rem;}
  .hname{font-family:'Cormorant Garamond',serif;font-size:1.3rem;color:var(--sand-light);}
  .hocc{font-size:.68rem;color:rgba(255,255,255,.5);white-space:nowrap;}
  .beds{display:flex;flex-wrap:wrap;gap:.3rem;margin:.6rem 0;}
  .bed{width:30px;height:30px;border-radius:5px;font-size:.55rem;display:flex;align-items:center;justify-content:center;cursor:pointer;border:1px solid transparent;font-weight:700;color:#0d1424;}
  .bed.paid{background:var(--good);} .bed.part{background:var(--sand);} .bed.owe{background:var(--bad);color:#fff;}
  .bed.open{background:rgba(255,255,255,.09);color:rgba(255,255,255,.5);border-color:rgba(201,169,110,.5);}
  .hfoot{font-size:.74rem;color:rgba(255,255,255,.7);line-height:1.6;border-top:1px solid rgba(255,255,255,.08);padding-top:.55rem;}
  .hfoot b{color:#fff;}
  .risk{color:#f3c48f;font-weight:700;}
  .legend{display:flex;gap:1rem;flex-wrap:wrap;font-size:.66rem;color:rgba(255,255,255,.55);margin-bottom:1rem;}
  .legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:.3rem;vertical-align:-2px;}
  /* COLLECTION / RESIDENT LIST */
  .rows{display:flex;flex-direction:column;gap:.55rem;}
  .row{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:9px;padding:.8rem 1rem;display:flex;gap:1rem;align-items:center;flex-wrap:wrap;cursor:pointer;}
  .row:hover{border-color:rgba(201,169,110,.45);}
  .row.hot{border-color:rgba(224,120,120,.5);}
  .rname{font-family:'Cormorant Garamond',serif;font-size:1.1rem;color:var(--sand-light);min-width:170px;}
  .rmeta{font-size:.74rem;color:rgba(255,255,255,.6);flex:1;min-width:180px;line-height:1.5;}
  .rbal{font-family:'Cormorant Garamond',serif;font-size:1.25rem;white-space:nowrap;}
  .rbal.owe{color:#f0b6b6;} .rbal.ok{color:#a9e5c3;}
  .chip{display:inline-block;font-size:.55rem;letter-spacing:.07em;text-transform:uppercase;padding:.16rem .5rem;border-radius:4px;font-weight:700;margin-right:.25rem;}
  .chip.hrss{background:rgba(124,92,191,.2);color:var(--lav);border:1px solid rgba(124,92,191,.45);}
  .chip.cliff{background:rgba(224,150,90,.2);color:#f3c48f;border:1px solid rgba(224,150,90,.5);}
  .chip.docs{background:rgba(224,120,120,.16);color:#f0b6b6;border:1px solid rgba(224,120,120,.4);}
  .chip.job{background:rgba(120,200,150,.16);color:#a9e5c3;border:1px solid rgba(120,200,150,.45);}
  .chip.open{background:rgba(201,169,110,.16);color:var(--sand-light);border:1px solid rgba(201,169,110,.45);}
  /* MODAL */
  .modal{display:none;position:fixed;inset:0;background:rgba(2,4,12,.92);z-index:100;overflow-y:auto;padding:2rem 1rem;}
  .modal.open{display:block;}
  .sheet{max-width:720px;margin:0 auto;background:var(--navy);border:1px solid rgba(201,169,110,.4);border-radius:12px;padding:1.6rem;}
  .sheet h2{font-family:'Cormorant Garamond',serif;font-weight:400;font-size:1.5rem;color:var(--sand-light);margin-bottom:.2rem;}
  .sheet .sub{font-size:.74rem;color:rgba(255,255,255,.5);margin-bottom:1.1rem;}
  .grp{border:1px solid rgba(201,169,110,.22);border-radius:9px;padding:.9rem 1rem;margin-bottom:.9rem;}
  .grp h4{font-size:.6rem;letter-spacing:.13em;text-transform:uppercase;color:var(--sand);margin-bottom:.7rem;}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:.7rem;}
  .three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.7rem;}
  input,select,textarea{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.15);border-radius:6px;color:#fff;font-family:'Raleway',sans-serif;font-size:.8rem;padding:.48rem .65rem;width:100%;}
  textarea{min-height:60px;resize:vertical;}
  label{display:block;font-size:.55rem;letter-spacing:.09em;text-transform:uppercase;color:rgba(255,255,255,.5);margin-bottom:.22rem;}
  .fld{margin-bottom:.65rem;}
  .checks{display:flex;flex-wrap:wrap;gap:.4rem .9rem;}
  .checks label{display:flex;align-items:center;gap:.35rem;font-size:.72rem;text-transform:none;letter-spacing:0;color:rgba(255,255,255,.8);cursor:pointer;margin:0;}
  .checks input{width:auto;}
  .btn{font-size:.63rem;letter-spacing:.06em;text-transform:uppercase;padding:.45rem 1rem;border-radius:5px;border:1px solid rgba(201,169,110,.45);background:transparent;color:var(--sand-light);cursor:pointer;font-family:'Raleway',sans-serif;}
  .btn.solid{background:rgba(201,169,110,.24);font-weight:700;}
  .btn.danger{border-color:rgba(224,120,120,.4);color:#f0b6b6;}
  .btnrow{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.6rem;}
  .note{max-width:640px;margin:3rem auto;text-align:center;color:rgba(255,255,255,.6);font-size:.9rem;line-height:1.8;}
  .note code{background:rgba(255,255,255,.08);padding:.1rem .4rem;border-radius:4px;}
  @media(max-width:640px){.two,.three{grid-template-columns:1fr;}}
  @media print{.tabs,.btn,.viewer{display:none!important}body{background:#fff;color:#000}.house,.row{border-color:#ccc}.hname,.stat .n{color:#000}}
</style>
</head>
<body>
<div class="top"><div class="top-inner">
  <h1>Housing <em>Command</em></h1>
  <div class="viewer"><span id="viewer"></span><a href="/mission-control">&larr; Mission Control</a></div>
</div></div>

<div class="wrap">
  <div class="stats" id="stats" style="display:none">
    <div class="stat"><div class="n" id="sOcc">–</div><div class="l">Occupancy</div></div>
    <div class="stat warn"><div class="n" id="sOpen">–</div><div class="l">Open Beds</div></div>
    <div class="stat warn"><div class="n" id="sRisk">–</div><div class="l">Monthly Revenue At Risk</div></div>
    <div class="stat bad"><div class="n" id="sOwed">–</div><div class="l">Total Outstanding</div></div>
    <div class="stat"><div class="n" id="sCollected">–</div><div class="l">Collected</div></div>
    <div class="stat bad"><div class="n" id="sCliff">–</div><div class="l">Funding Cliffs 30d</div></div>
  </div>

  <div class="tabs" id="tabs" style="display:none">
    <button class="tab active" data-t="map">War Map</button>
    <button class="tab" data-t="collect">Collection Board</button>
    <button class="tab" data-t="success">Success Records</button>
    <button class="tab" data-t="beds">Open Beds</button>
    <input id="q" placeholder="Search resident, house, room…">
    <button class="btn" onclick="window.print()">Print</button>
    <button class="btn" onclick="exportCSV()">CSV</button>
  </div>

  <div class="legend" id="legend" style="display:none">
    <span><i style="background:#78c896"></i>Paid in full</span>
    <span><i style="background:#c9a96e"></i>Partial</span>
    <span><i style="background:#e07878"></i>Owing</span>
    <span><i style="background:rgba(255,255,255,.12);border:1px solid rgba(201,169,110,.5)"></i>Open bed</span>
  </div>

  <div id="view"></div>
  <div class="note" id="note">Loading…</div>
</div>

<!-- RESIDENT MODAL -->
<div class="modal" id="mRes"><div class="sheet">
  <h2 id="rTitle">Resident</h2>
  <div class="sub" id="rSub"></div>
  <input type="hidden" id="r_id">

  <div class="grp"><h4>Placement</h4>
    <div class="three">
      <div class="fld"><label>Name</label><input id="r_name"></div>
      <div class="fld"><label>House</label><input id="r_house"></div>
      <div class="fld"><label>Room</label><input id="r_room"></div>
    </div>
    <div class="three">
      <div class="fld"><label>Status</label><select id="r_status">
        <option value="active">Active</option><option value="open">Open bed</option>
        <option value="moved_out">Moved out</option><option value="graduated">Graduated</option><option value="evicted">Evicted</option>
      </select></div>
      <div class="fld"><label>Move in</label><input id="r_movein" type="date"></div>
      <div class="fld"><label>Move out</label><input id="r_moveout" type="date"></div>
    </div>
    <div class="three">
      <div class="fld"><label>Phone</label><input id="r_phone"></div>
      <div class="fld"><label>Email</label><input id="r_email"></div>
      <div class="fld"><label>Emergency contact</label><input id="r_emerg"></div>
    </div>
  </div>

  <div class="grp"><h4>Money</h4>
    <div class="three">
      <div class="fld"><label>Monthly rent</label><input id="r_rent"></div>
      <div class="fld"><label>Past due</label><input id="r_past"></div>
      <div class="fld"><label>Current due</label><input id="r_cur"></div>
    </div>
    <div class="three">
      <div class="fld"><label>Amount paid</label><input id="r_paid"></div>
      <div class="fld"><label>Pay schedule</label><select id="r_sched"><option value="monthly">Monthly</option><option value="weekly">Weekly</option><option value="biweekly">Bi-weekly</option></select></div>
      <div class="fld"><label>Net income (take-home)</label><input id="r_net"></div>
    </div>
    <div class="three">
      <div class="fld"><label>Who pays</label><select id="r_payer">
        <option value="self">Self</option><option value="HRSS">HRSS (Medicaid)</option><option value="scholarship">Scholarship</option>
        <option value="church">Church</option><option value="staff">Staff / personal</option><option value="mixed">Mixed</option>
      </select></div>
      <div class="fld"><label>Funding source</label><input id="r_fsrc" placeholder="e.g. HRSS, Solida"></div>
      <div class="fld"><label>Funding ends (the cliff)</label><input id="r_fend" type="date"></div>
    </div>
  </div>

  <div class="grp"><h4>Success Record</h4>
    <div class="checks" style="margin-bottom:.8rem">
      <label><input type="checkbox" id="r_id_doc"> ID</label>
      <label><input type="checkbox" id="r_ss"> SS card</label>
      <label><input type="checkbox" id="r_bc"> Birth certificate</label>
      <label><input type="checkbox" id="r_bank"> Bank account</label>
      <label><input type="checkbox" id="r_emp"> Employed</label>
    </div>
    <div class="three">
      <div class="fld"><label>Employer</label><input id="r_employer"></div>
      <div class="fld"><label>Job start</label><input id="r_jobstart" type="date"></div>
      <div class="fld"><label>Savings balance</label><input id="r_savings"></div>
    </div>
    <div class="three">
      <div class="fld"><label>Certifications (separate with |)</label><input id="r_certs" placeholder="OSHA 10|Food Handler"></div>
      <div class="fld"><label>Case manager</label><input id="r_cm"></div>
      <div class="fld"><label>Treatment level</label><select id="r_tl"><option value="">—</option><option>PHP</option><option>IOP</option><option>GOP</option><option>none</option></select></div>
    </div>
  </div>

  <div class="grp"><h4>Notes</h4>
    <div class="fld"><textarea id="r_notes"></textarea></div>
  </div>

  <div class="grp"><h4>Log a payment or event</h4>
    <div class="three">
      <div class="fld"><label>Type</label><select id="e_kind">
        <option value="payment">Payment received</option><option value="maintenance">Maintenance</option>
        <option value="welfare">Welfare check</option><option value="conflict">Conflict</option>
        <option value="curfew">Curfew</option><option value="note">Note</option>
      </select></div>
      <div class="fld"><label>Amount (if payment)</label><input id="e_amount"></div>
      <div class="fld"><label>&nbsp;</label><button class="btn solid" style="width:100%" onclick="logEvent(this)">Log it</button></div>
    </div>
    <div class="fld"><label>Detail</label><input id="e_detail"></div>
  </div>

  <div class="btnrow">
    <button class="btn solid" onclick="saveRes(this)">Save resident</button>
    <button class="btn" onclick="closeM()">Close</button>
    <button class="btn danger" style="margin-left:auto" onclick="delRes()">Delete</button>
  </div>
</div></div>

<script>
let HOUSES=[],RES=[],EVENTS=[],TAB='map',Q='';
const g=id=>document.getElementById(id);
function esc(t){const d=document.createElement('div');d.textContent=(t==null?'':t);return d.innerHTML;}
function n(v){return Number(v)||0;}
function money(v){return '$'+n(v).toLocaleString('en-US',{maximumFractionDigits:0});}
function bal(r){return n(r.past_due)+n(r.current_due)-n(r.amount_paid);}
function until(d){if(!d)return null;try{return Math.ceil((new Date(d+'T00:00:00')-new Date())/86400000);}catch(_){return null;}}
function isOpen(r){return (r.status||'')==='open';}
function docsDone(r){return r.has_id&&r.has_ss_card&&r.has_birth_cert;}
function closeM(){g('mRes').classList.remove('open');}

function openRes(id){
  const r=RES.find(x=>x.id===id); if(!r)return;
  g('rTitle').textContent=r.name||'Resident';
  g('rSub').textContent=(r.house_name||'')+(r.room?(' · Room '+r.room):'');
  g('r_id').value=r.id;
  const set=(el,v)=>{g(el).value=v==null?'':v;};
  set('r_name',r.name);set('r_house',r.house_name);set('r_room',r.room);
  g('r_status').value=r.status||'active';
  set('r_movein',r.move_in_date);set('r_moveout',r.move_out_date);
  set('r_phone',r.phone);set('r_email',r.email);set('r_emerg',r.emergency_contact);
  set('r_rent',r.monthly_rent);set('r_past',r.past_due);set('r_cur',r.current_due);set('r_paid',r.amount_paid);
  g('r_sched').value=r.pay_schedule||'monthly'; set('r_net',r.net_income);
  g('r_payer').value=r.payer_type||'self'; set('r_fsrc',r.funding_source);set('r_fend',r.funding_end);
  g('r_id_doc').checked=!!r.has_id; g('r_ss').checked=!!r.has_ss_card; g('r_bc').checked=!!r.has_birth_cert;
  g('r_bank').checked=!!r.bank_account; g('r_emp').checked=!!r.employed;
  set('r_employer',r.employer);set('r_jobstart',r.job_start_date);set('r_savings',r.savings_balance);
  set('r_certs',r.certifications);set('r_cm',r.case_manager); g('r_tl').value=r.treatment_level||'';
  set('r_notes',r.notes);
  g('e_amount').value=''; g('e_detail').value='';
  g('mRes').classList.add('open');
}
async function saveRes(btn){
  const b={id:g('r_id').value,name:g('r_name').value,house_name:g('r_house').value,room:g('r_room').value,
    status:g('r_status').value,move_in_date:g('r_movein').value,move_out_date:g('r_moveout').value,
    phone:g('r_phone').value,email:g('r_email').value,emergency_contact:g('r_emerg').value,
    monthly_rent:g('r_rent').value,past_due:g('r_past').value,current_due:g('r_cur').value,amount_paid:g('r_paid').value,
    pay_schedule:g('r_sched').value,net_income:g('r_net').value,payer_type:g('r_payer').value,
    funding_source:g('r_fsrc').value,funding_end:g('r_fend').value,
    has_id:g('r_id_doc').checked,has_ss_card:g('r_ss').checked,has_birth_cert:g('r_bc').checked,
    bank_account:g('r_bank').checked,employed:g('r_emp').checked,
    employer:g('r_employer').value,job_start_date:g('r_jobstart').value,savings_balance:g('r_savings').value,
    certifications:g('r_certs').value,case_manager:g('r_cm').value,treatment_level:g('r_tl').value,notes:g('r_notes').value};
  btn.textContent='Saving…';
  const r=await fetch('/housing/update',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});
  btn.textContent='Save resident';
  if(r.ok){closeM();load();}else{alert('Save failed');}
}
async function logEvent(btn){
  const id=g('r_id').value; const res=RES.find(x=>x.id===id)||{};
  const b={event:true,resident_id:id,resident_name:res.name,house_name:res.house_name,
    kind:g('e_kind').value,amount:g('e_amount').value,detail:g('e_detail').value};
  if(!b.detail&&!b.amount){alert('Add an amount or a detail');return;}
  btn.textContent='…';
  const r=await fetch('/housing/update',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});
  btn.textContent='Log it';
  if(r.ok){closeM();load();}else{alert('Log failed');}
}
async function delRes(){
  if(!confirm('Delete this record permanently?'))return;
  const r=await fetch('/housing/update',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:g('r_id').value,action:'delete'})});
  if(r.ok){closeM();load();}
}

function match(r){
  if(!Q)return true;
  const q=Q.toLowerCase();
  return ((r.name||'')+' '+(r.house_name||'')+' '+(r.room||'')+' '+(r.funding_source||'')).toLowerCase().includes(q);
}

function render(){
  const v=g('view'); const note=g('note'); note.style.display='none';
  const houseNames=HOUSES.length?HOUSES.map(h=>h.name):[...new Set(RES.map(r=>r.house_name))];

  if(TAB==='map'){
    g('legend').style.display='flex';
    v.innerHTML='<div class="houses">'+houseNames.map(hn=>{
      const beds=RES.filter(r=>r.house_name===hn);
      const open=beds.filter(isOpen), filled=beds.filter(r=>!isOpen(r));
      const occ=beds.length?Math.round(filled.length/beds.length*100):0;
      const owed=filled.reduce((t,r)=>t+Math.max(bal(r),0),0);
      const risk=open.reduce((t,r)=>t+n(r.monthly_rent||775),0);
      const cells=beds.map(r=>{
        let cls='open',txt=r.room||'';
        if(!isOpen(r)){const b=bal(r); cls=b<=0?'paid':(n(r.amount_paid)>0?'part':'owe');}
        return '<div class="bed '+cls+'" title="'+esc((r.name||'Open')+' · '+(r.room||'')+' · '+(isOpen(r)?'open':money(bal(r))+' owed'))+'" onclick="openRes(\''+r.id+'\')">'+esc(txt)+'</div>';
      }).join('');
      return '<div class="house"><div class="hhead"><div class="hname">'+esc(hn)+'</div>'
        +'<div class="hocc">'+filled.length+'/'+beds.length+' · '+occ+'%</div></div>'
        +'<div class="beds">'+cells+'</div>'
        +'<div class="hfoot"><b>Outstanding:</b> '+money(owed)
        +(open.length?(' &nbsp;·&nbsp; <span class="risk">'+open.length+' open = '+money(risk)+'/mo at risk</span>'):'')
        +'</div></div>';
    }).join('')+'</div>';
    return;
  }
  g('legend').style.display='none';

  if(TAB==='beds'){
    const rows=RES.filter(r=>isOpen(r)&&match(r));
    v.innerHTML='<div class="rows">'+(rows.length?rows.map(r=>
      '<div class="row" onclick="openRes(\''+r.id+'\')"><div class="rname">'+esc(r.house_name)+'</div>'
      +'<div class="rmeta">Room '+esc(r.room||'—')+' · <span class="chip open">available</span></div>'
      +'<div class="rbal ok">'+money(r.monthly_rent||775)+'/mo</div></div>').join('')
      :'<div class="note">No open beds — every bed is filled.</div>')+'</div>';
    return;
  }

  if(TAB==='collect'){
    const rows=RES.filter(r=>!isOpen(r)&&match(r)).sort((a,b)=>bal(b)-bal(a));
    v.innerHTML='<div class="rows">'+rows.map(r=>{
      const b=bal(r); const cliff=until(r.funding_end);
      return '<div class="row'+(b>=1500?' hot':'')+'" onclick="openRes(\''+r.id+'\')">'
      +'<div class="rname">'+esc(r.name)+'</div>'
      +'<div class="rmeta">'+esc(r.house_name||'')+(r.room?' · '+esc(r.room):'')
      +(r.payer_type&&r.payer_type!=='self'?' <span class="chip hrss">'+esc(r.payer_type)+'</span>':'')
      +(cliff!==null&&cliff<=30&&cliff>=0?' <span class="chip cliff">funding ends '+cliff+'d</span>':'')
      +(r.notes?'<br><span style="opacity:.65;font-style:italic">'+esc(String(r.notes).slice(0,90))+'</span>':'')
      +'</div>'
      +'<div class="rbal '+(b>0?'owe':'ok')+'">'+(b>0?money(b):'current')+'</div></div>';
    }).join('')+'</div>';
    return;
  }

  // success records
  const rows=RES.filter(r=>!isOpen(r)&&match(r));
  v.innerHTML='<div class="rows">'+rows.map(r=>{
    const docs=[r.has_id?'ID':'',r.has_ss_card?'SS':'',r.has_birth_cert?'BC':''].filter(Boolean).length;
    return '<div class="row" onclick="openRes(\''+r.id+'\')">'
    +'<div class="rname">'+esc(r.name)+'</div>'
    +'<div class="rmeta">'+esc(r.house_name||'')
    +(docsDone(r)?' <span class="chip job">docs complete</span>':' <span class="chip docs">docs '+docs+'/3</span>')
    +(r.employed?' <span class="chip job">employed'+(r.employer?': '+esc(r.employer):'')+'</span>':'')
    +(r.bank_account?' <span class="chip job">bank</span>':'')
    +(r.certifications?' <span class="chip job">'+esc(String(r.certifications).split('|').join(', '))+'</span>':'')
    +(r.case_manager?'<br><span style="opacity:.6">CM: '+esc(r.case_manager)+'</span>':'')
    +'</div>'
    +'<div class="rbal ok">'+(n(r.savings_balance)?money(r.savings_balance):'—')+'</div></div>';
  }).join('')+'</div>';
}

function exportCSV(){
  const cols=['name','house_name','room','status','monthly_rent','past_due','current_due','amount_paid','payer_type','funding_source','funding_end','has_id','has_ss_card','has_birth_cert','employed','employer','case_manager','notes'];
  const e=v=>{v=(v==null?'':v)+'';return '"'+v.replace(/"/g,'""')+'"';};
  const csv=[cols.join(',')].concat(RES.map(r=>cols.map(c=>e(r[c])).join(','))).join('\r\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
  a.download='housing-'+new Date().toISOString().slice(0,10)+'.csv';a.click();
}

g('tabs').addEventListener('click',e=>{const t=e.target.closest('.tab');if(!t)return;
  TAB=t.dataset.t;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===t));render();});
g('q').addEventListener('input',e=>{Q=e.target.value.trim();render();});

async function load(){
  const note=g('note');
  try{
    const res=await fetch('/housing/list');
    const d=await res.json();
    if(res.status===401){note.textContent=d.error||'Not signed in.';return;}
    if(d.error){note.innerHTML='Error: '+esc(d.error)+'<br><br>If this says the table is missing, run <code>1-housing-schema.sql</code> then <code>2-housing-import.sql</code> in Supabase.';return;}
    HOUSES=d.houses||[];RES=d.residents||[];EVENTS=d.events||[];
    g('viewer').textContent='Signed in as '+(d.viewer||'');
    const filled=RES.filter(r=>!isOpen(r)),open=RES.filter(isOpen);
    const owed=filled.reduce((t,r)=>t+Math.max(bal(r),0),0);
    const paid=filled.reduce((t,r)=>t+n(r.amount_paid),0);
    const risk=open.reduce((t,r)=>t+n(r.monthly_rent||775),0);
    const cliffs=filled.filter(r=>{const u=until(r.funding_end);return u!==null&&u<=30&&u>=0;}).length;
    g('sOcc').textContent=RES.length?Math.round(filled.length/RES.length*100)+'%':'–';
    g('sOpen').textContent=open.length; g('sRisk').textContent=money(risk);
    g('sOwed').textContent=money(owed); g('sCollected').textContent=money(paid);
    g('sCliff').textContent=cliffs;
    g('stats').style.display='grid'; g('tabs').style.display='flex';
    render();
  }catch(_){note.textContent='Could not load housing. Check your connection and reload.';}
}
load();
</script>
