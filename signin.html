<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Signing you in — The Next Right Thing</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,400&family=Raleway:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  :root{--navy:#1a2744;--deep:#121c33;--sand:#c9a96e;--sandl:#e8d5b0;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--deep);color:#fff;font-family:'Raleway',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem 1.4rem;}
  .card{max-width:460px;text-align:center;}
  h1{font-family:'Cormorant Garamond',serif;font-weight:300;font-size:2rem;margin-bottom:.6rem;}
  h1 em{color:var(--sandl);font-style:italic;}
  p{color:rgba(255,255,255,.7);font-weight:300;line-height:1.75;font-size:.95rem;margin-bottom:1.4rem;}
  .spin{width:34px;height:34px;border:2px solid rgba(201,169,110,.25);border-top-color:var(--sand);border-radius:50%;margin:0 auto 1.4rem;animation:s .9s linear infinite;}
  @keyframes s{to{transform:rotate(360deg)}}
  a.btn{display:inline-block;background:linear-gradient(145deg,#e8d5b0,var(--sand));color:#1a2744;font-weight:700;padding:.85rem 1.8rem;border-radius:7px;text-decoration:none;font-size:.9rem;}
  .quiet{font-size:.78rem;color:rgba(255,255,255,.42);margin-top:1.6rem;line-height:1.7;}
</style>
</head>
<body>
<div class="card">
  <div class="spin"></div>
  <h1>You're <em>in</em>.</h1>
  <p id="msg">Taking you where you were headed…</p>
  <a class="btn" id="go" href="/mission-control">Continue</a>
  <div class="quiet">The Next Right Thing in Recovery</div>
</div>
<script>
// Reaching this page at all means Cloudflare Access already signed you in
// and set your cookie. All that's left is to send you back where you started.
(function(){
  var SAFE = ['/mission-control','/housing','/funding','/intake-queue',
              '/in-kind-report','/donations-report','/admin-issue','/carwash-report'];
  var next = new URLSearchParams(location.search).get('next') || '/mission-control';
  if (SAFE.indexOf(next) === -1) next = '/mission-control';   // never redirect off-site
  document.getElementById('go').href = next;
  setTimeout(function(){ location.replace(next); }, 700);
})();
</script>
</body>
</html>
